name: Scheduled scrape

on:
  schedule:
    - cron: "17 5 * * *" # every day at 05:17 UTC
  workflow_dispatch:
    inputs:
      sources:
        description: "Space-separated sources to run (empty = all): books quotes quotes_js"
        required: false
        default: ""
      max_pages:
        description: "Stop after N pages per source (0 = all). A capped run never marks listings removed."
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: scheduled-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LW_DB_URL: sqlite:///data/listings.db
      # Optional repository secret: Slack or Discord incoming-webhook URL for broken-scraper alerts.
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      LW_MAX_PAGES: ${{ inputs.max_pages }}
      SOURCES: ${{ inputs.sources }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      # Scraped data is never committed. The SQLite file is carried between runs in the
      # Actions cache so "new / unchanged / removed" keeps working day after day.
      - name: Restore database from the previous run
        uses: actions/cache/restore@v4
        with:
          path: data
          key: listings-db-${{ github.run_id }}
          restore-keys: listings-db-

      - name: Scrape
        id: scrape
        continue-on-error: true # still export and save state, then fail the job below
        run: |
          args=()
          for s in $SOURCES; do args+=(--source "$s"); done
          python -m listings_watch run "${args[@]}"

      - name: Export CSV and Excel
        if: always()
        run: |
          python -m listings_watch export --format csv --out exports/listings.csv
          python -m listings_watch export --format xlsx --out exports/listings.xlsx

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listings-${{ github.run_number }}
          path: exports/
          retention-days: 30
          if-no-files-found: warn

      - name: Save database for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: listings-db-${{ github.run_id }}

      - name: Fail the job if a scraper is broken
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::At least one source is broken or failed. See the Scrape step log."
          exit 1
